<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anuj sangwan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<style>
  /* Theme Variables */
  body {
    --bg: #1C1B1A;         /* Warm Charcoal (Dark Mode) */
    --fg: #E6E2DD;
    --muted: #968E85;
    --card-bg: #262423;
    --border: #383431;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  body.light-mode {
    --bg: #F2F4F7;         /* Muted Mist Grey (Bright Mode) */
    --fg: #1F242D;
    --muted: #647082;
    --card-bg: #FFFFFF;
    --border: #DCE1E8;
    --shadow: rgba(31, 36, 45, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    transition: background-color 0.2s ease, color 0.2s ease;
    overflow-x: hidden;
  }

  /* Board Canvas Setup */
  .desk-board {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 2rem;
  }

  /* Physical Light Switch in Top Right Corner */
  .light-switch-plate {
    position: absolute;
    top: 2rem;
    right: 2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 6px;
    box-shadow: 0 4px 12px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 100;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .switch-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-radius: 4px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .switch-btn:hover {
    color: var(--fg);
    background: var(--border);
  }

  .switch-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Active state highlight on the switch */
  body:not(.light-mode) #btn-dark,
  body.light-mode #btn-light {
    background: var(--border);
    color: var(--fg);
  }

  /* Interactive Desk Items Layout */
  .item {
    position: absolute;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .item:hover {
    transform: translateY(-4px) scale(1.01);
  }

  /* 1. Polaroid (About) */
  .polaroid {
    top: 3rem;
    left: 15%;
    background: var(--card-bg);
    padding: 10px 10px 25px 10px;
    box-shadow: 0 8px 24px var(--shadow);
    border: 1px solid var(--border);
    width: 160px;
    transform: rotate(-3deg);
  }
  .polaroid img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    filter: grayscale(20%);
  }
  .polaroid span {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 0.95rem;
    color: var(--fg);
  }

  /* 2. Central ID Card / Nameplate */
  .id-card {
    top: 8rem;
    left: 38%;
    background: var(--card-bg);
    padding: 2rem;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px var(--shadow);
    width: 300px;
    text-align: center;
    transform: rotate(1deg);
  }
  .id-card h1 {
    font-size: 1.35rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .id-card p {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* 3. Notebook (Blog) */
  .notebook {
    bottom: 4rem;
    left: 35%;
    background: #4A658A;
    color: #FFF;
    padding: 2.5rem 2rem;
    border-radius: 4px;
    box-shadow: 0 12px 35px var(--shadow);
    width: 200px;
    text-align: center;
    transform: rotate(-2deg);
  }
  .notebook span {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  /* 4. Philosophy Note */
  .note-sticky {
    top: 5rem;
    right: 25%;
    background: var(--card-bg);
    padding: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px var(--shadow);
    transform: rotate(4deg);
    font-size: 0.9rem;
  }

  /* Responsive layout adjustment for smaller screens */
  @media (max-width: 768px) {
    .desk-board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 5rem 1rem 3rem 1rem;
    }
    .item {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      transform: none !important;
      width: 100%;
      max-width: 280px;
    }
    .light-switch-plate {
      top: 1rem;
      right: 1rem;
    }
  }
</style>
<script>
  // Instant theme loader to prevent any flash on load
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.style.backgroundColor = '#F2F4F7';
  } else {
    document.documentElement.style.backgroundColor = '#1C1B1A';
  }
</script>
</head>
<body>

  <div class="desk-board">
    <!-- Physical Light Switch (Top Right) -->
    <div class="light-switch-plate" role="group" aria-label="Theme Switcher">
      <button type="button" class="switch-btn" id="btn-dark" title="Dark Mode (Warm Charcoal)">
        <!-- Moon Icon -->
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button type="button" class="switch-btn" id="btn-light" title="Bright Mode (Muted Mist Grey)">
        <!-- Sun Icon -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      </button>
    </div>

    <!-- 1. Clickable Polaroid -> links to about/ -->
    <a href="about/" class="item polaroid">
      <img src="assets/me.jpg" alt="Anuj Sangwan">
      <span>about</span>
    </a>

    <!-- 2. Central ID Card -->
    <div class="item id-card">
      <h1>Anuj Sangwan</h1>
      <p>Hacker &amp; Maker</p>
    </div>

    <!-- 3. Clickable Notebook -> links to writing/blog -->
    <a href="blog/" class="item notebook">
      <span>writing</span>
    </a>

    <!-- 4. Clickable Note -> links to now/ -->
    <a href="now/" class="item note-sticky">
      <span>philosophy &amp; now ↗</span>
    </a>
  </div>

  <script>
    // Theme switching logic with instant application & storage
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
    }

    const btnDark = document.getElementById('btn-dark');
    const btnLight = document.getElementById('btn-light');

    btnDark.addEventListener('click', () => {
      document.body.classList.remove('light-mode');
      localStorage.setItem('theme', 'dark');
      document.documentElement.style.backgroundColor = '#1C1B1A';
    });

    btnLight.addEventListener('click', () => {
      document.body.classList.add('light-mode');
      localStorage.setItem('theme', 'light');
      document.documentElement.style.backgroundColor = '#F2F4F7';
    });
  </script>
</body>
</html>
