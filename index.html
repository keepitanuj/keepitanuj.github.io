<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuj Sangwan</title>
<meta name="description" content="Anuj Sangwan — write, running, experience, discipline, quant and other random things.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">

<style>
  :root {
    --bg: #cdd6de;
    --bg-top: #d8e0e7;
    --sill-bg: #bec9d3;
    --sill-edge: #aebbc7;
    --ink: #1d242b;
    --muted: #4b5866;
    --card-bg: #f7f9fb;
    --pill-bg: #c3ced8;
  }

  [data-theme="dark"] {
    /* Warm Charcoal (Dark Theme) */
    --bg: #22211f;
    --bg-top: #262522;
    --sill-bg: #1b1a18;
    --sill-edge: #32302c;
    --ink: #ebe7e0;
    --muted: #a39e93;
    --card-bg: #2d2b28;
    --card-border: rgba(255, 255, 255, 0.08);
    --tape: rgba(168, 154, 128, 0.35);
    --shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 3px 8px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 22px 38px rgba(0, 0, 0, 0.65), 0 8px 16px rgba(0, 0, 0, 0.4);
    --pill-bg: #32302c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 100%);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
    transition: background 0.35s ease, color 0.35s ease;
  }

  /* Top-Right Theme Toggle Pill */
  .theme-toggle {
    position: fixed;
    top: 22px;
    right: 26px;
    z-index: 100;
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px;
    display: flex;
    flex-direction: row;
    gap: 4px;
    box-shadow: var(--shadow);
  }
  .theme-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .theme-btn.active {
    background: var(--card-bg);
    color: var(--ink);
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
  }

  /* UPPER HERO SECTION (Generous Breathing Room) */
  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 70px 24px 30px;
  }

  .hero-inner {
    display: flex;
    align-items: center;
    gap: 42px;
    max-width: 820px;
  }

  /* Polaroid Photo (About Me) */
  .polaroid-btn {
    position: relative;
    cursor: pointer;
    transform: rotate(-4deg);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    flex-shrink: 0;
  }
  .polaroid-btn:hover {
    transform: rotate(-1deg) translateY(-5px);
  }
  .tape {
    width: 64px;
    height: 16px;
    background: var(--tape);
    margin: 0 auto -8px;
    position: relative;
    z-index: 5;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .polaroid-card {
    background: #faf9f5;
    padding: 10px 10px 14px;
    border-radius: 3px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.08);
    width: 152px;
    text-align: center;
  }
  .polaroid-img-box {
    width: 130px;
    height: 142px;
    background: #d8dfdb;
    overflow: hidden;
  }
  .polaroid-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(1.06);
    transition: filter 0.3s ease;
    display: block;
  }
  .polaroid-btn:hover .polaroid-img-box img {
    filter: grayscale(15%) contrast(1.03);
  }
  .polaroid-caption {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: #2b2e2c;
    margin-top: 8px;
    line-height: 1;
  }

  /* Title & Pillars */
  .hero-text h1 {
    font-size: 3.1rem;
    font-weight: 400;
    letter-spacing: -0.025em;
    line-height: 1.08;
    margin-bottom: 10px;
  }
  .hero-pillars {
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.6;
  }
  .hero-random {
    font-family: 'Caveat', cursive;
    font-size: 1.35rem;
    color: var(--muted);
    margin-top: 6px;
  }

  /* LOWER WINDOWSILL HORIZON SHELF */
  .horizon-wrap {
    position: relative;
    width: 100%;
    padding-top: 40px;
  }

  /* The Physical Shelf Ledge */
  .windowsill-ledge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 92px;
    background: var(--sill-bg);
    border-top: 3px solid var(--sill-edge);
    box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.04);
    z-index: 1;
    transition: background 0.35s ease, border-color 0.35s ease;
  }

  .shelf-items {
    position: relative;
    z-index: 10;
    max-width: 1220px;
    margin: 0 auto;
    padding: 0 28px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    perspective: 1000px;
  }

  .shelf-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .shelf-item:hover {
    transform: translateY(-10px);
  }
  .shelf-label {
    font-family: 'Caveat', cursive;
    font-size: 1.32rem;
    color: var(--ink);
    margin-top: 14px;
    letter-spacing: 0.2px;
    opacity: 0.88;
  }

  /* 1. SHAKTIMAAN (Left) */
  .item-shaktimaan {
    transform-style: preserve-3d;
  }
  .shaktimaan-cutout {
    width: 105px;
    height: 162px;
    object-fit: contain;
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.24));
    transform-style: preserve-3d;
    display: block;
  }
  @keyframes shaktimaanHorizonSpin {
    0%   { transform: translate(0, 0) rotateY(0deg) scale(1); filter: drop-shadow(0 8px 10px rgba(0,0,0,0.24)); }
    15%  { transform: translate(20px, -160px) rotateY(1080deg) scale(1.1); filter: drop-shadow(0 0 18px rgba(255, 200, 40, 0.9)); }
    45%  { transform: translate(480px, -280px) rotateY(3600deg) scale(1.15); filter: drop-shadow(0 0 24px rgba(255, 190, 20, 0.95)); }
    75%  { transform: translate(860px, -140px) rotateY(6120deg) scale(1.08); filter: drop-shadow(0 0 20px rgba(255, 200, 40, 0.9)); }
    92%  { transform: translate(120px, -40px) rotateY(7560deg) scale(1.02); }
    100% { transform: translate(0, 0) rotateY(7920deg) scale(1); filter: drop-shadow(0 8px 10px rgba(0,0,0,0.24)); }
  }
  .shaktimaan-flying .shaktimaan-cutout {
    animation: shaktimaanHorizonSpin 3.3s cubic-bezier(0.4, 0.05, 0.6, 0.95) forwards;
  }
  .shaktimaan-flying {
    z-index: 999 !important;
  }

  /* 2. QUANT NOTEPAD */
  .quant-pad {
    width: 136px;
    height: 166px;
    background: #fdfbf2;
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 18px 14px 12px;
    position: relative;
    color: #2b302e;
    background-image: repeating-linear-gradient(transparent, transparent 20px, #d7e2dc 21px);
    border-top: 8px solid #4a5550;
  }
  .quant-pad .math-scribble {
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    line-height: 21px;
    color: #2c3e35;
  }

  /* 3. PHILOSOPHY - ARISTOTLE BUST */
  .aristotle-bust {
    width: 120px;
    height: 146px;
    filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.18));
  }

  /* 4. BLOG NOTEBOOK (Centerpiece on Shelf) */
  .blog-notebook {
    width: 170px;
    height: 206px;
    background: linear-gradient(135deg, #aeb8b4, #94a09b);
    border-radius: 4px 12px 12px 4px;
    box-shadow: var(--shadow);
    border-left: 12px solid #75807b;
    display: grid;
    place-items: center;
  }
  .blog-sticker {
    background: #f8f7f2;
    color: #222;
    padding: 8px 24px;
    font-family: 'Caveat', cursive;
    font-size: 1.7rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transform: rotate(-2deg);
  }

  /* 5. GALLERY - RETRO DSLR CAMERA */
  .dslr-body {
    width: 158px;
    height: 104px;
    background: linear-gradient(145deg, #d7dad8, #b3b8b5);
    border-radius: 12px;
    box-shadow: var(--shadow);
    border: 2px solid #969c99;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dslr-top-bump {
    position: absolute;
    top: -11px;
    left: 54px;
    width: 50px;
    height: 12px;
    background: #4e5351;
    border-radius: 5px 5px 0 0;
  }
  .dslr-lens {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3d4852, #171a1c 70%);
    border: 5px solid #e4e7e5;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    position: relative;
  }
  .dslr-lens::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 14px;
    width: 14px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    transform: rotate(-25deg);
  }

  /* 6. READING - STACK OF BOOKS */
  .book-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .book-slab {
    height: 22px;
    border-radius: 3px 6px 6px 3px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.16);
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .book-1 { width: 124px; background: #dfd39b; color: #3a341b; border-left: 8px solid #9e8f4c; }
  .book-2 { width: 136px; background: #c59b76; color: #2e1d10; border-left: 8px solid #8a6240; }
  .book-3 { width: 130px; background: #7e948b; color: #f4f7f5; border-left: 8px solid #52665e; }

  /* 7. PHONE WITH INSTA, GITHUB, GMAIL */
  .item-phone {
    cursor: default;
  }
  .item-phone:hover {
    transform: translateY(-6px);
  }
  .phone-frame {
    width: 118px;
    height: 196px;
    background: #1b1d1f;
    border-radius: 20px;
    padding: 7px;
    box-shadow: var(--shadow);
    border: 2px solid #3c4044;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    background: linear-gradient(165deg, #2d3748 0%, #1a202c 100%);
    border-radius: 14px;
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .phone-time {
    color: rgba(255,255,255,0.88);
    font-family: sans-serif;
    font-size: 0.72rem;
    text-align: center;
  }
  .phone-apps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    justify-items: center;
    margin: auto 0;
  }
  .app-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.35);
  }
  .app-icon:hover {
    transform: scale(1.22);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 16, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    place-items: center;
    z-index: 500;
    padding: 20px;
  }
  .modal-backdrop.open {
    display: grid;
  }
  .modal-box {
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-hover);
    max-width: 520px;
    width: 100%;
    padding: 28px 32px;
    border-radius: 8px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.4rem;
    color: var(--muted);
    cursor: pointer;
  }
  .modal-box h2 {
    font-weight: 400;
    font-size: 1.6rem;
    margin-bottom: 10px;
  }
  .modal-box p, .modal-box li {
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .modal-box ul {
    margin-top: 10px;
    padding-left: 18px;
  }
  .modal-box li {
    margin-bottom: 6px;
  }

  /* Responsive Mobile Layout */
  @media (max-width: 960px) {
    .hero-inner {
      flex-direction: column;
      text-align: center;
      gap: 24px;
    }
    .hero-text h1 {
      font-size: 2.3rem;
    }
    .windowsill-ledge {
      display: none;
    }
    .shelf-items {
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px 26px;
      padding-bottom: 50px;
    }
  }
</style>
</head>

  <!-- LOWER WINDOWSILL HORIZON SHELF -->
  <section class="horizon-wrap">

    <div class="shelf-items">

      <!-- 1. SHAKTIMAAN -->

      <!-- 4. BLOG NOTEBOOK (Links to blog/) -->
